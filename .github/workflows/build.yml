name: Build plugin

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Paket, bu reponun kendi icinden (raw.githubusercontent.com) indirilir.
      # Jar'a gomulen zip ile ayni commit'ten oldugu icin SHA-1 her zaman tutar.
      - name: Build
        run: >
          mvn -B package
          -Dpack.url=https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/src/main/resources/GaunCraft_Resourcepack-4.zip

      - uses: actions/upload-artifact@v4
        with:
          name: GaunCraft_Resourcepack-4
          path: target/GaunCraft_Resourcepack-4.jar

      - name: Attach jar to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: target/GaunCraft_Resourcepack-4.jar
